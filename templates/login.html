<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CloudDropper - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">


        <div class="auth-brand">

            <div class="auth-logo">
                ☁
            </div>

            <span>
                CloudDropper
            </span>

        </div>


        <div class="auth-heading">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to manage your cloud files.
            </p>

        </div>


        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="auth-message {{ category }}"
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="auth-field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="auth-field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <label class="show-password">

                    <input
                        type="checkbox"
                        onclick="
                            document.getElementById(
                                'loginPassword'
                            ).type =
                            this.checked
                            ? 'text'
                            : 'password'
                        "
                    >

                    Show password

                </label>

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <div class="auth-switch">

            Don't have an account?

            <a
                href="{{ url_for('register') }}"
            >
                Create Account
            </a>

        </div>

    </div>

</div>

</body>

</html>
